    <li class="articulo" id="a-{{id}}" data-id="{{id}}">
      <div class="foto"><span class="foto-texto">{{que}}</span><img src="{{imagen}}" alt="" width="112" height="112" loading="lazy" decoding="async" referrerpolicy="no-referrer"></div>
      <div class="cuerpo">
        <h4 class="que">{{que}}</h4>
        <p class="producto">{{producto}}</p>
        <p class="precio">{{precio}}</p>
        <p class="aviso">{{aviso}}</p>
        <p class="tienda"><a href="{{url}}" target="_blank" rel="noopener noreferrer">Ver en {{tienda}}<span class="sr"> (se abre en otra pestaña)</span> <span aria-hidden="true">↗</span></a></p>
      </div>
      <div class="interaccion" data-js></div>
    </li>
